[project]
name = "06-ingestion-script"
version = "0.1.0"
description = "Creating the Data Ingestion Script"
readme = "README.md"
authors = [
    { name = "Victor Kauan", email = "victorkauan.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.1",
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
06-ingestion-script = "_06_ingestion_script:main"

[tool.uv.build-backend]
module-name = "_06_ingestion_script"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
